<div class="gant">
  @for (info of infoGant(); track $index; let num = $index) {
    @for (item of info.gant; track item.label) {

      <span
        class="line"
        [ngStyle]="getLinePosition(
          item.x1,
          item.x2,
          num
        )">
      </span>

      <span
        class="legend"
        [ngStyle]="getLegendPosition(
          item.x1,
          item.x2,
          num
        )">
        {{ item.label }}
      </span>
    }
  }
</div>
